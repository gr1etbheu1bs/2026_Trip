<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2026年に管理している旅行ページの一覧">
  <title>2026 旅行一覧</title>
  <style>
    :root { color-scheme:light; --ink:#17332d; --muted:#5d6f6a; --paper:#f4f7f4; --card:#fff; --green:#246d59; --line:#d8e3dd; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; line-height:1.65; }
    header { padding:clamp(42px,8vw,76px) 20px; color:#fff; background:linear-gradient(135deg,#174b40,#2b7662 68%,#789e76); }
    .wrap { width:min(100% - 32px,1040px); margin:auto; }
    .eyebrow { margin:0 0 8px; font-size:.8rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.82; }
    h1 { margin:0; font-size:clamp(2.2rem,7vw,4.25rem); line-height:1.12; }
    header p:last-child { max-width:660px; margin:16px 0 0; }
    main { padding:clamp(32px,6vw,64px) 0 72px; }
    h2 { margin:0 0 18px; font-size:clamp(1.5rem,4vw,2rem); }
    .trip-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:18px; }
    .trip-card { display:flex; flex-direction:column; min-width:0; padding:clamp(22px,5vw,30px); border:1px solid var(--line); border-top:6px solid var(--green); border-radius:20px; background:var(--card); box-shadow:0 10px 30px #17332d0d; }
    .trip-card h3 { margin:6px 0 4px; font-size:1.35rem; }
    .place { margin:0; color:var(--muted); font-weight:700; }
    time { display:block; margin:16px 0 22px; font-weight:800; font-variant-numeric:tabular-nums; }
    .trip-link { display:flex; align-items:center; justify-content:space-between; min-height:52px; margin-top:auto; padding:12px 16px; border-radius:12px; color:#fff; background:var(--green); font-weight:800; text-decoration:none; }
    .trip-link:hover,.trip-link:focus-visible { background:#174f41; }
    footer { padding:24px 16px; border-top:1px solid var(--line); color:var(--muted); text-align:center; }
    @media (max-width:420px) { .wrap { width:min(100% - 24px,1040px); } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <p class="eyebrow">2026 Trip Portal</p>
      <h1>旅行一覧</h1>
      <p>旅行ごとの予定、候補、施設情報をまとめたページへ移動できます。</p>
    </div>
  </header>
  <main class="wrap">
    <section aria-labelledby="trips-title">
      <p class="eyebrow">Trips</p>
      <h2 id="trips-title">管理中の旅行</h2>
      <div class="trip-grid">
        <article class="trip-card">
          <p class="place">軽井沢</p>
          <h3>2026 軽井沢旅行</h3>
          <time datetime="2026-08-16/2026-08-23">2026-08-16〜2026-08-23</time>
          <a class="trip-link" href="trips/karuizawa/">旅行ページを見る <span aria-hidden="true">→</span></a>
        </article>
        <article class="trip-card">
          <p class="place">神奈川方面</p>
          <h3>神奈川方面の親子科学旅行</h3>
          <time datetime="2026-08-12/2026-08-14">2026-08-12〜2026-08-14</time>
          <a class="trip-link" href="trips/kanagawa/">旅行ページを見る <span aria-hidden="true">→</span></a>
        </article>
      </div>
    </section>
  </main>
  <footer>旅行ごとのページとデータは独立して管理しています。</footer>
</body>
</html>
